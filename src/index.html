<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Tyler" />
    <meta
      name="description"
      content=" Spots is a social media platform for sharing photos of beautiful places. Users can create profiles, post images, and interact with others through likes and comments."
    />
    <meta name="keywords" content="HTML, CSS, ????" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <title>Spots</title>
    <!-- <link rel="stylesheet" type="text/css" href="./pages/index.css" crossorigin /> -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="<%=require('./images/Logo.svg')%>"
          alt="header logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class = "avatar__container">
            <img
              src=""
              alt="Profile Avatar"
              class="profile__avatar"
            />
            <button type="button" class="avatar__edit-button">
              <img
                src="<%=require('./images/Group3.svg')%>"
                alt="Edit Avatar"
              />
              Edit Avatar
            </button>
          </div>
          <div class="profile__column">
            <h1 class="profile__title"></h1>
            <p class="profile__subtitle"></p>
            <button type="button" class="profile__edit-button">
              <img
                src="<%=require('./images/Group2.svg')%>"
                alt="Edit pencil"
              />
              Edit Profile
            </button>
          </div>
          <button type="button" class="profile__new-post-button">
            <img
              src="<%=require('./images/Group26.svg')%>"
              alt="plus sign for new post"
            />
            New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <img src="" alt="" class="card__image" />
                <button type="button" class="card__delete-button"></button>

                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button type="button" class="card__like-button"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">2025 © Spots</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>
          <h2 class="modal__title">Edit Profile</h2>
          <form class="modal__form">
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type your name"
                required
                minlength="2"
                maxlength="40"
              />
              <span id="profile-name-input-error" class="modal__error"></span>
            </label>
            <label for="profile-description-input" class="modal__label">
              Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
                required
                minlength="2"
                maxlength="200"
              />
              <span
                id="profile-description-input-error"
                class="modal__error"
              ></span>
            </label>
            <button
              type="submit"
              class="modal__save-btn"
            >
              Save
            </button>
          </form>
        </div>
      </div>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>
          <h2 class="modal__title">New post</h2>
          <form class="modal__form">
            <label for="card-image-input" class="modal__label">
              Image link
              <input
                id="card-image-input"
                type="url"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required
              />
              <span id="card-image-input-error" class="modal__error"></span>
            </label>
            <label for="card-caption-input" class="modal__label">
              Caption
              <input
                id="card-caption-input"
                type="text"
                class="modal__input"
                placeholder="Type your caption"
                required
                minlength="2"
                maxlength="30"
              />
              <span id="card-caption-input-error" class="modal__error"></span>
            </label>
            <button
              type="submit"
              class="modal__save-btn"
              id = "modal__save-second-btn"
            >
              Save
            </button>
          </form>
        </div>
      </div>
    </div>
    <div class="modal modal_type_preview" id="preview-image-modal">
      <div class="modal__image-container">
        <button
          type="button"
          class="modal__close-btn modal__close-btn_type_preview"
        ></button>
        <img src="" alt="" class="modal__image" />
        <p class="modal__caption"></p>
      </div>
    </div>
    <!-- modal__delete__container -->
    <div class="modal" id="delete-image-modal">
      <div class="modal__delete">
        <button
          type="button"
          class="modal__close-btn modal__close-btn-delete-modal"
        ></button>
        <p>Are you sure you want to delete this image?</p>
        <div class="modal__delete-btn-wrapper">
          <button
            type="button"
            class="modal__delete-btn modal__delete-btn_type_preview"
          >
            Delete
          </button>

          <button type="button" class="modal__delete-cancel-btn">Cancel</button>
        </div>
      
      </div>
    </div>
    <div class="modal" id="new-avatar-modal">
      
       <div class="modal__container">
         <button type="button" class="modal__close-btn"></button>
                  <h2 class="modal__title-avatar">Edit profile avatar</h2>
          <form class="modal__form">
            <label for="card-image-input" class="modal__label">
              Profile Picture
              <input
                id="card-image-input"
                type="url"
                class="modal__input"
                placeholder="Paste link to an image"
                required
              />
              <span id="card-image-input-error" class="modal__error"></span>
            </label>
             <button
            type="submit"
            class="modal__save-btn"
          >
            Save
          </button>
          </form>
      
          

        </div>
        </div>
      </div>
      </div>
  </body>
</html>
